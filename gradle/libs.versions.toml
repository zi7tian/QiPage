[versions]
agp = "8.10.1"
kotlin = "2.1.21"
compose = "1.8.2"
material3 = "1.3.2"
activity = "1.10.1"
coroutines = "1.10.2"
readium = "3.1.2"

[libraries]
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
readium-shared = { module = "org.readium.kotlin-toolkit:readium-shared", version.ref = "readium" }
readium-streamer = { module = "org.readium.kotlin-toolkit:readium-streamer", version.ref = "readium" }
readium-navigator = { module = "org.readium.kotlin-toolkit:readium-navigator", version.ref = "readium" }
junit = { module = "junit:junit", version = "4.13.2" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }
fragment = { module = "androidx.fragment:fragment-ktx", version = "1.8.7" }
room-runtime = { module = "androidx.room:room-runtime", version = "2.7.1" }
room-compiler = { module = "androidx.room:room-compiler", version = "2.7.1" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.1.7" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.9.0" }
viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.9.0" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version = "2.1.21-2.0.1" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
